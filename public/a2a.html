<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITRE Explorer — A2A Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 20px 24px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 12px; }
  .header svg { width: 24px; height: 24px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header span { font-size: 11px; color: #64748b; background: #1e293b; padding: 2px 8px; border-radius: 4px; }
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #1e3a5f; align-self: flex-end; max-width: 80%; border-bottom-right-radius: 4px; }
  .msg.agent { background: #1e293b; border: 1px solid #334155; align-self: flex-start; max-width: 90%; border-bottom-left-radius: 4px; }
  .msg.agent .skill { display: inline-block; font-size: 10px; color: #0d9488; background: #064e3b; padding: 1px 6px; border-radius: 3px; margin-bottom: 8px; font-family: monospace; }
  .msg.error { background: #3b1111; border: 1px solid #7f1d1d; color: #fca5a5; }
  .msg.loading { color: #64748b; font-style: italic; }
  .input-bar { padding: 16px 24px; border-top: 1px solid #1e293b; background: #0f172a; }
  .input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; }
  .input-wrap input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 16px; border-radius: 8px; font-size: 14px; outline: none; }
  .input-wrap input:focus { border-color: #0d9488; }
  .input-wrap input::placeholder { color: #475569; }
  .input-wrap button { background: #0d9488; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .input-wrap button:hover { background: #0f766e; }
  .input-wrap button:disabled { opacity: 0.5; cursor: not-allowed; }
  .examples { max-width: 800px; margin: 40px auto; padding: 0 24px; }
  .examples h2 { font-size: 13px; color: #64748b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .examples .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .examples button { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px 14px; border-radius: 8px; font-size: 12px; text-align: left; cursor: pointer; transition: all 0.15s; }
  .examples button:hover { border-color: #0d9488; color: #e2e8f0; }
  .rate { text-align: center; font-size: 11px; color: #475569; padding: 8px; }
</style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 32 32" fill="none">
      <g transform="translate(16,16) rotate(45) translate(-11,-11)">
        <rect x="0" y="0" width="10.8" height="10.8" fill="#0d9488" opacity="0.6"/>
        <rect x="11.2" y="0" width="10.8" height="10.8" fill="#0d9488" opacity="0.75"/>
        <rect x="11.2" y="11.2" width="10.8" height="10.8" fill="#0d9488" opacity="0.88"/>
        <rect x="0" y="11.2" width="10.8" height="10.8" fill="#0d9488" opacity="1"/>
      </g>
    </svg>
    <h1>MITRE Explorer Agent</h1>
    <span>A2A v1.0 &middot; Gemini 3.1 Flash-Lite</span>
  </div>

  <div class="chat" id="chat">
    <div class="examples" id="examples">
      <h2>Try asking</h2>
      <div class="grid">
        <button onclick="ask(this.textContent)">What CVEs affect Apache HTTP Server?</button>
        <button onclick="ask(this.textContent)">Which groups target the healthcare sector?</button>
        <button onclick="ask(this.textContent)">Give me Sigma rules for T1566 Phishing</button>
        <button onclick="ask(this.textContent)">What new CVEs were published this week?</button>
        <button onclick="ask(this.textContent)">Show the attack surface for LiteLLM</button>
        <button onclick="ask(this.textContent)">What NIST controls map to T1078?</button>
        <button onclick="ask(this.textContent)">Latest threat reports</button>
        <button onclick="ask(this.textContent)">What is CVE-2024-3400?</button>
      </div>
    </div>
  </div>

  <div class="rate" id="rate"></div>
  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Ask about CVEs, techniques, threat groups, applications..." autofocus
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" />
      <button id="btn" onclick="send()">Send</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('btn');
const rate = document.getElementById('rate');
let msgId = 0;

function ask(text) {
  input.value = text;
  send();
}

function addMsg(text, cls, skill) {
  const ex = document.getElementById('examples');
  if (ex) ex.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (skill) div.innerHTML = '<div class="skill">' + esc(skill) + '</div>' + formatText(text);
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function formatText(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;

  addMsg(text, 'user');
  const loading = addMsg('Thinking...', 'loading');

  try {
    const res = await fetch('/api/a2a', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: 'msg-' + (++msgId),
        method: 'message/send',
        params: { message: { role: 'user', parts: [{ text }] } }
      })
    });

    const remaining = res.headers.get('X-RateLimit-Remaining');
    const limit = res.headers.get('X-RateLimit-Limit');
    if (remaining !== null) rate.textContent = remaining + ' / ' + limit + ' requests remaining today';

    const data = await res.json();
    loading.remove();

    if (data.error) {
      addMsg(data.error.message, 'error');
    } else {
      const result = data.result;
      const agentText = result?.status?.message?.parts?.[0]?.text ?? 'No response.';
      const skill = result?.artifacts?.[0]?.name ?? null;
      addMsg(agentText, 'agent', skill);
    }
  } catch (e) {
    loading.remove();
    addMsg('Connection error: ' + e.message, 'error');
  }
  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
