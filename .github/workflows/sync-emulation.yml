name: Sync Emulation Plans
on:
  schedule:
    # Quarterly. Upstream (CTID adversary_emulation_library) last changed
    # 2025-05-28; the run is a full replace of ~375 rows, so a quarter is
    # plenty and workflow_dispatch covers anything sooner.
    - cron: '0 6 1 */3 *'
  workflow_dispatch: {}

permissions:
  contents: read

# The ingest also takes an advisory lock; this just avoids a pointless second runner.
concurrency:
  group: sync-emulation
  cancel-in-progress: false

# A GitHub Action rather than an app/api/cron route: it needs a git clone and
# the `yaml` package, which the app does not ship.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Sparse clone of the ten plan files only
        # Blob-less + sparse: the library also ships implant source and
        # payloads, which have no business on a runner that holds
        # DATABASE_URL. Keep this list in step with src/lib/emulation-plans.mjs.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/center-for-threat-informed-defense/adversary_emulation_library.git /tmp/aelib
          git -C /tmp/aelib sparse-checkout set --no-cone \
            /apt29/Emulation_Plan/yaml/APT29.yaml \
            /carbanak/Emulation_Plan/yaml/Carbanak.yaml \
            /fin6/Emulation_Plan/yaml/FIN6.yaml \
            /fin7/Emulation_Plan/yaml/Fin7.yaml \
            /menu_pass/Emulation_Plan/yaml/menupass.yaml \
            /oilrig/Emulation_Plan/yaml/oilrig.yaml \
            /sandworm/Emulation_Plan/yaml/sandworm.yaml \
            /turla/Emulation_Plan/yaml/turla_carbon.yaml \
            /turla/Emulation_Plan/yaml/turla_snake.yaml \
            /wizard_spider/Emulation_Plan/yaml/wizard_spider.yaml
          echo "EMULATION_COMMIT=$(git -C /tmp/aelib rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install pg@8.23.0 yaml@2.9.1 --ignore-scripts --no-audit --no-fund
      - name: Parse and sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-emulation.mjs /tmp/aelib
