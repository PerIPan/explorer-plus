name: Sync Atomic Red Team
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone Atomic Red Team
        run: git clone --depth 1 https://github.com/redcanaryco/atomic-red-team.git /tmp/atomic-red-team
      - name: Install dependencies
        run: npm install pg yaml
      - name: Parse and sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-atomic.mjs
