name: Sync Atomic Red Team
on:
  schedule:
    # Monthly. Upstream is bursty (57 tests landed in one run, 163 in another, with
    # dead weeks between) and the script does a full clone and full sweep with no
    # per-run cap, so one monthly pass still captures a whole burst.
    - cron: '0 5 1 * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Clone Atomic Red Team
        run: git clone --depth 1 https://github.com/redcanaryco/atomic-red-team.git /tmp/atomic-red-team
      - name: Install dependencies
        run: npm install pg yaml
      - name: Parse and sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-atomic.mjs
