name: Update MITRE ATT&CK (manual)

# Manual trigger only. MITRE releases roughly twice a year — a human
# review gate before each content rotation is preferable to an automatic
# schedule (which could push regressions silently between checks).

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Comma-separated domains (atlas-attack is out of scope — use sync-atlas.mjs)'
        required: false
        default: 'enterprise-attack,mobile-attack,ics-attack'
      dry-run:
        description: 'Preview only — no DB writes (still captures pre-snapshot)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Override the strictly-greater attack-version guard'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python STIX deps
        # Install from the manifest, not an inline pin: this job spawns
        # seed/extract.py (scripts/update-attack.mjs), so it must run the same
        # mitreattack-python that seed/ is written against. An inline pin drifted
        # to 4.0.0 while seed/requirements.txt moved to 5.4.3.
        run: pip install -r seed/requirements.txt

      - name: Install pg
        run: npm install pg

      - name: Run update-attack
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          ARGS+=(--domains="${{ github.event.inputs.domains }}")
          node scripts/update-attack.mjs "${ARGS[@]}"

      # scf_technique_heat caches group_count per technique, and an ATT&CK
      # rotation is the only thing that moves it. On a monthly cron alone it
      # went wrong on 2026-09-21 and stayed wrong: 69 of 1,295 rows carried a
      # stale group_count for ten days, on the badges the compliance page
      # shows. A calendar cannot know when a rotation happened; this step can.
      # TRUNCATE + rebuild inside one transaction, measured at 190ms.
      - name: Rebuild CTI heat badges
        if: ${{ github.event.inputs.dry-run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/refresh-cti-heat.mjs
