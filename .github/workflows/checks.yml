name: Checks

# Two gates, run in parallel:
#   consistency — config drift, no deps, seconds
#   build-gate  — typecheck + tests, the things that break `next build`
#
# build-gate exists because CI installed nothing, compiled nothing and ran no
# tests, so Vercel was the first thing to build any branch — every compile
# error and every failing test was discovered as a failed deployment.
#
# It would NOT have caught the deploy that prompted it: that was a module-scope
# throw over a missing env var, which compiles fine. check-api-catalog.mjs in
# the consistency job catches that one. These two gates cover different halves.
#
# Both jobs run without a database and without secrets — verified: 135 tests
# pass and tsc is clean with DATABASE_URL and PROFILE_IP_SALT unset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Fails if the catch-all CWE threshold drifts between inference.ts and the
      # SQL/mjs build-time copies (see scripts/check-catchall-threshold.mjs).
      - run: node scripts/check-catchall-threshold.mjs
      # Fails if a route under app/api/v1 is in neither the open-API catalogue
      # nor the guard's EXCLUDED map, if an entry points at no route, or if the
      # agent tool count disagrees across site.ts, declarations.ts and llms.txt.
      - run: node scripts/check-api-catalog.mjs
      # Fails if cli/lib/commands.generated.mjs is stale against API_CATALOG, if
      # the CLI's copy of api-request.mjs has diverged from src/lib's, or if the
      # application-slug rule no longer matches the one in tools/execute.ts.
      # The CLI's whole claim is that its commands ARE the REST surface.
      - run: npm run check:cli

  build-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The compile step Vercel would otherwise be first to run.
      - run: npx tsc --noEmit
      # 135 tests, including scripts/lib/*.test.mjs — the guards' own tests,
      # which until now ran nowhere in CI.
      - run: npm test
