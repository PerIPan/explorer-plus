name: Checks

# Two gates, run in parallel:
#   consistency — config drift, no deps, seconds
#   build-gate  — typecheck + tests, the things that break `next build`
#
# build-gate exists because CI installed nothing, compiled nothing and ran no
# tests, so Vercel was the first thing to build any branch — every compile
# error and every failing test was discovered as a failed deployment.
#
# It would NOT have caught the deploy that prompted it: that was a module-scope
# throw over a missing env var, which compiles fine. check-api-catalog.mjs in
# the consistency job catches that one. These two gates cover different halves.
#
# Both jobs run without a database and without secrets — verified: the suite
# passes and tsc is clean with DATABASE_URL and PROFILE_IP_SALT unset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # `npm run check:consistency`, not three inlined commands, so this job and
      # a developer typing `npm run lint` run the SAME set. They had no shared
      # definition, which is how a gate ends up existing only in CI.
      #
      # It covers: the catch-all CWE threshold drifting between inference.ts and
      # the SQL/mjs build-time copies; a route under app/api/v1 being in neither
      # the open-API catalogue nor the guard's EXCLUDED map, an entry pointing at
      # no route, or the agent tool count disagreeing across site.ts,
      # declarations.ts and llms.txt; and cli/lib/commands.generated.mjs being
      # stale against API_CATALOG, the CLI's copy of api-request.mjs diverging
      # from src/lib's, or the application-slug rule no longer matching
      # tools/execute.ts. The CLI's whole claim is that its commands ARE the
      # REST surface.
      #
      # ...and scripts/check-workflows.mjs, which refuses an EMPTY GitHub
      # expression anywhere (a parse error that kills the whole workflow file,
      # not just a step) and any expression inside a `run:` block (the
      # injection pattern these workflows were hardened against). On 2026-10-02
      # the first of those shipped in seven files at once and left six
      # scheduled syncs dead on main; `yaml.safe_load` had parsed them all
      # happily, so YAML validity proves nothing.
      #
      # Still no `npm ci` above: none of these needs node_modules.
      - run: npm run check:consistency

  build-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The compile step Vercel would otherwise be first to run.
      - run: npx tsc --noEmit
      # Includes scripts/lib/*.test.mjs — the guards' own tests, which until
      # this job existed ran nowhere in CI. Deliberately no count here: the
      # previous comment said 135 and the suite is well past that, and a number
      # in a comment is a number nobody updates.
      - run: npm test
