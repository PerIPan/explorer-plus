name: sync-scf

# Twice-yearly + manual. SCF ships quarterly but our review cadence is 6-monthly.
on:
  schedule:
    - cron: '0 0 10 1,7 *'  # 10 Jan + 10 Jul at 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'SCF release tag to ingest (default: latest)'
        required: false
        type: string
      dry_run:
        description: 'Dry-run (no DB writes)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Skip version guard'
        required: false
        default: false
        type: boolean
      allow_shrink:
        description: 'Proceed even if rebuilt tables are >30% smaller than live (see SHRINK_GATE)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-scf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Release/asset lookup goes through the GitHub API; unauthenticated calls
      # share a 60/hour budget per runner IP.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --omit=dev --include=optional || npm ci

      - name: Run sync-scf
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS --version=${{ github.event.inputs.version }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.allow_shrink }}" = "true" ]; then
            ARGS="$ARGS --allow-shrink"
          fi
          echo "Args: $ARGS"
          node --experimental-strip-types scripts/sync-scf.mjs $ARGS
