name: sync-scf

# Twice-yearly + manual. SCF ships quarterly but our review cadence is 6-monthly.
on:
  schedule:
    # SCF ships quarterly with patches (2026.1 Apr 2, 2026.1.1 Apr 22, 2026.2 Jul 8,
    # 2026.3 Sep 21 — verified against the GitHub releases API). Twice a year would
    # have left 2026.3 uningested until 2027, superseded before it ever landed.
    # Monthly on the 10th catches each release within ~30 days; the script no-ops
    # when the version tag has not moved.
    - cron: '0 0 10 * *'  # 10 Jan + 10 Jul at 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'SCF release tag to ingest (default: latest)'
        required: false
        type: string
      dry_run:
        description: 'Dry-run (no DB writes)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Skip version guard'
        required: false
        default: false
        type: boolean
      allow_shrink:
        description: 'Proceed even if rebuilt tables are >30% smaller than live (see SHRINK_GATE)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-scf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --omit=dev --include=optional || npm ci

      # Secrets scoped to this step: at job level, actions/checkout and
      # actions/setup-node could both read DATABASE_URL, and neither needs it.
      #
      # The workflow_dispatch inputs arrive through `env` rather than being
      # interpolated into the script. A GitHub expression naming an input,
      # written inside a `run:` block, is substituted BEFORE the shell sees it, so a
      # value containing a shell metacharacter becomes a command in a job that
      # holds the production credential. Triggering needs repo write access, so
      # this was never open to the public — but the fix costs nothing and the
      # pattern should not be copied into the next workflow.
      - name: Run sync-scf
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Release/asset lookup goes through the GitHub API; unauthenticated
          # calls share a 60/hour budget per runner IP.
          GITHUB_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink }}
        run: |
          ARGS=""
          if [ -n "$IN_VERSION" ]; then
            ARGS="$ARGS --version=$IN_VERSION"
          fi
          if [ "$IN_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$IN_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$IN_ALLOW_SHRINK" = "true" ]; then
            ARGS="$ARGS --allow-shrink"
          fi
          echo "Args: $ARGS"
          node --experimental-strip-types scripts/sync-scf.mjs $ARGS
