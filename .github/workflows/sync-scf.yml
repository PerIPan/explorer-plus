name: sync-scf

# Twice-yearly + manual. SCF ships quarterly but our review cadence is 6-monthly.
on:
  schedule:
    # SCF ships quarterly with patches (2026.1 Apr 2, 2026.1.1 Apr 22, 2026.2 Jul 8,
    # 2026.3 Sep 21 — verified against the GitHub releases API). Twice a year would
    # have left 2026.3 uningested until 2027, superseded before it ever landed.
    # Monthly on the 10th catches each release within ~30 days; the script no-ops
    # when the version tag has not moved.
    - cron: '0 0 10 * *'  # 10 Jan + 10 Jul at 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'SCF release tag to ingest (default: latest)'
        required: false
        type: string
      dry_run:
        description: 'Dry-run (no DB writes)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Skip version guard'
        required: false
        default: false
        type: boolean
      allow_shrink:
        description: 'Proceed even if rebuilt tables are >30% smaller than live (see SHRINK_GATE)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-scf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Release/asset lookup goes through the GitHub API; unauthenticated calls
      # share a 60/hour budget per runner IP.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --omit=dev --include=optional || npm ci

      - name: Run sync-scf
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS --version=${{ github.event.inputs.version }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.allow_shrink }}" = "true" ]; then
            ARGS="$ARGS --allow-shrink"
          fi
          echo "Args: $ARGS"
          node --experimental-strip-types scripts/sync-scf.mjs $ARGS
