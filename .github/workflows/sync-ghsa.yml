name: Sync GitHub Security Advisories
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch: {}

# Prevent overlapping runs from double-inserting via the diff-upsert windows
concurrency:
  group: sync-ghsa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pg
        run: npm install pg
      - name: Sync GHSA
        env:
          TOKEN_GHSA: ${{ secrets.TOKEN_GHSA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-ghsa.mjs
