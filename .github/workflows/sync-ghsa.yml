name: Sync GitHub Security Advisories (full rebase)
on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sundays 04:00 UTC — sweeps the full advisory-database tree
  workflow_dispatch: {}

# Prevent overlapping runs with the delta workflow
concurrency:
  group: sync-ghsa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Clone github/advisory-database (curated only, shallow + sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/github/advisory-database.git /tmp/advdb
          cd /tmp/advdb
          git sparse-checkout set advisories/github-reviewed
          echo "Cloned. File count:"
          find advisories/github-reviewed -name '*.json' | wc -l
      - name: Install pg
        run: npm install pg@8.23.0 --ignore-scripts --no-audit --no-fund
      - name: Bulk sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-ghsa-bulk.mjs /tmp/advdb/advisories/github-reviewed
