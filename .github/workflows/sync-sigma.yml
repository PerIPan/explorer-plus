name: Sync Sigma Rules
on:
  schedule:
    # Monthly. 15 new rules in 90 days against a 3,146-row table, and 7 of 13 weekly
    # runs inserted nothing. The script has no batch cap — it clones the repo and
    # sweeps the whole tree — so a monthly run collects a month of upstream in one
    # pass rather than falling behind.
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Clone SigmaHQ
        run: git clone --depth 1 https://github.com/SigmaHQ/sigma.git /tmp/sigma
      - name: Install pg
        run: npm install pg@8.23.0 --ignore-scripts --no-audit --no-fund
      - name: Parse and sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-sigma.mjs
