name: Sync Sigma Rules
on:
  schedule:
    # Monthly. 15 new rules in 90 days against a 3,146-row table, and 7 of 13 weekly
    # runs inserted nothing. The script has no batch cap — it clones the repo and
    # sweeps the whole tree — so a monthly run collects a month of upstream in one
    # pass rather than falling behind.
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Clone SigmaHQ
        run: git clone --depth 1 https://github.com/SigmaHQ/sigma.git /tmp/sigma
      - name: Install pg
        run: npm install pg
      - name: Parse and sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-sigma.mjs
