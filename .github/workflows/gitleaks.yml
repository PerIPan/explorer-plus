name: gitleaks

# Secret scan of every push to main and every PR into it. gitleaks-action
# scans the commits being pushed or proposed, not the whole history.
#
# Why: a committed env file is how keys end up public. The local pre-commit
# hook lives in each clone's .git/hooks and is skipped by --no-verify; this
# check is neither.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
